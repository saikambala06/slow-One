<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobTrail AI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e6e8f2;
        background:
          radial-gradient(500px 300px at 100% -20%, rgba(34,211,238,0.25), transparent 60%),
          radial-gradient(500px 400px at -20% 100%, rgba(124,92,255,0.35), transparent 60%),
          #0a0f22;
      }
      header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg,#7c5cff,#22d3ee); display:grid; place-items:center; color:#000; font-weight:900; }
      main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
      label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color:#9aa3c7; }
      input {
        width: 100%; padding: 8px 10px; border-radius: 8px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
        color: #e6e8f2; font-size: 13px; outline: none;
      }
      input:focus { border-color:#7c5cff; }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 10px;
        background: linear-gradient(120deg,#7c5cff,#22d3ee);
        color: white; font-weight: 700; cursor: pointer; font-size: 13px;
      }
      button.ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e6e8f2; font-weight: 500; }
      .row { display:flex; gap:8px; }
      .status { font-size: 12px; color: #9aa3c7; }
      .ok { color: #34d399; }
      .err { color: #fb7185; }
      a { color: #a78bfa; text-decoration: none; font-size: 12px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">J</div>
      <div>
        <div style="font-weight:700">JobTrail<span style="color:#a78bfa">AI</span></div>
        <div style="font-size:11px;color:#9aa3c7">One-click job autofill</div>
      </div>
    </header>
    <main>
      <div id="setup">
        <label>API base URL</label>
        <input id="apiUrl" placeholder="https://your-app.vercel.app" />
        <label style="margin-top:8px">Your API key</label>
        <input id="apiKey" placeholder="jt_..." />
        <div style="margin-top:10px" class="row">
          <button id="save">Save</button>
          <button id="test" class="ghost">Test connection</button>
        </div>
        <div id="msg" class="status" style="margin-top:8px"></div>
        <div style="margin-top:8px"><a href="#" id="openApp" target="_blank">Get your API key →</a></div>
      </div>

      <div id="actions" style="display:none">
        <div class="status">Signed in ✓</div>
        <button id="autofill">⚡ Autofill this page</button>
        <div class="grid">
          <button id="scan" class="ghost">🔍 Scan fields</button>
          <button id="logout" class="ghost">Sign out</button>
        </div>
        <div id="log" class="status"></div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
